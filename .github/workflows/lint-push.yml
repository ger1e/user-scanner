name: Lint & Type Checks

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & types (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Enforce immutable GitHub Action refs
        shell: python
        run: |
          from pathlib import Path
          import re

          action_line = re.compile(r'^\s*-\s+uses:\s+([^#\s]+)')
          sha = re.compile(r'^[0-9a-fA-F]{40}$')
          failures = []

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  match = action_line.match(line)
                  if not match:
                      continue
                  target = match.group(1)
                  if target.startswith('./') or target.startswith('docker://'):
                      continue
                  if '@' not in target:
                      failures.append(f'{path}:{number}: missing ref: {target}')
                      continue
                  ref = target.rsplit('@', 1)[1]
                  if not sha.fullmatch(ref):
                      failures.append(f'{path}:{number}: mutable action ref: {target}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print('Immutable Action refs: PASS')

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install httpx curl_cffi colorama types-colorama rich "mcp>=1.2.0,<2"
          pip install ruff==0.15.22 mypy

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy user_scanner
