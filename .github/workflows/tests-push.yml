name: Tests (pytest + coverage)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (pytest + coverage) — ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python info
        run: |
          python --version
          which python
          python -m pip --version

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-
            ${{ runner.os }}-pip-

      - name: Install package & test deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[mcp]"
          pip install pytest pytest-cov pytest-anyio anyio[trio]

      - name: Show installed packages
        run: pip freeze | sed -n '1,200p'

      - name: Run pytest with coverage
        run: |
          mkdir -p test-output
          pytest -vv --maxfail=1 \
            --junitxml=test-output/report.xml \
            --cov=user_scanner \
            --cov-report=xml:test-output/coverage.xml \
            --cov-report=term

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: test-output
